    const resourceBlobs = {};

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

        }
      }

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');

      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

auto; height: auto; }\n.logo-fsm { height: 72px; }\n.logo-sprep { height: 64px; }\n.logo-af { height: 46px; }\n\n/* KPI Grid */\n.kpi-grid {\n  display: grid;\n  grid-template-columns: repeat(4, minmax(0, 1fr));\n  gap: 16px;\n  width: 100%;\n  box-sizing: border-box;\n}\n.kpi-card {\n  background: #FFFFFF;\n  border: 2px solid #8DB6DC;\n  border-radius: 10px;\n  padding: 16px 14px;\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n  justify-content: center;\n  height: 100%;\n  box-sizing: border-box;\n  box-shadow: 0 2px 8px rgba(27, 42, 120, 0.05);\n  transition: transform 0.15s ease, box-shadow 0.15s ease;\n}\n.kpi-label {\n  font-size: 13px;\n  color: #6C707A;\n  text-align: center;\n  font-weight: 600;\n  line-height: 1.35;\n}\n.kpi-val {\n  font-size: clamp(24px, 3.5vw, 32px);\n  font-weight: 800;\n  color: #1B2A78;\n  line-height: 1.15;\n  text-align: center;\n}\n\n/* Section Headings */\n.section-title {\n  font-size: clamp(22px, 3.5vw, 26px);\n  font-weight: 700;\n  color: #1B2A78;\n  letter-spacing: -0.01em;\n  padding-top: 16px;\n}\n\n/* About Section */\n.about-grid {\n  display: grid;\n  grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);\n  gap: 32px;\n  align-items: start;\n  padding: 8px 0 4px;\n  width: 100%;\n  box-sizing: border-box;\n}\n.about-text {\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n  font-size: 16px;\n  line-height: 1.65;\n  text-wrap: pretty;\n  color: #2B2D33;\n}\n.work-areas {\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n  width: 100%;\n}\n.work-area-item {\n  display: flex;\n  align-items: flex-start;\n  gap: 12px;\n  font-size: 14.5px;\n  line-height: 1.5;\n  background: #FFFFFF;\n  border: 1px solid rgba(141, 182, 220, 0.45);\n  border-radius: 10px;\n  padding: 12px 14px;\n  box-shadow: 0 1px 4px rgba(43, 45, 51, 0.03);\n  box-sizing: border-box;\n}\n.work-area-num {\n  font-weight: 800;\n  color: #FFFFFF;\n  background: #1B2A78;\n  width: 24px;\n  height: 24px;\n  border-radius: 50%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 12px;\n  flex: none;\n  margin-top: 1px;\n}\n.work-area-text {\n  flex: 1;\n  color: #2B2D33;\n}\n\n/* Component Header */\n.component-header {\n  border-radius: 12px;\n  padding: 20px 24px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: 16px 24px;\n  background: #1B2A78;\n  width: 100%;\n  box-sizing: border-box;\n  box-shadow: 0 2px 8px rgba(27, 42, 120, 0.08);\n}\n.component-name {\n  color: #FFFFFF;\n  font-size: clamp(20px, 3vw, 22px);\n  font-weight: 700;\n}\n.component-counts { display: flex; gap: 28px; }\n.component-count { display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }\n.component-count-val { font-size: clamp(24px, 4vw, 30px); font-weight: 800; line-height: 1; }\n.component-count-label { color: #8DB6DC; font-size: 13px; }\n\n/* Shared panel card */\n.panel-card {\n  border: 2px solid #8DB6DC;\n  border-radius: 10px;\n  background: #FFFFFF;\n  padding: 24px 28px;\n  display: flex;\n  flex-direction: column;\n  gap: 18px;\n  width: 100%;\n  box-sizing: border-box;\n}\n.panel-title { font-size: 17px; font-weight: 700; color: #1B2A78; }\n.panel-sub { font-size: 14px; color: #6C707A; line-height: 1.45; }\n.legend { display: flex; gap: 10px 18px; flex-wrap: wrap; font-size: 13px; color: #2B2D33; }\n.legend > div { display: flex; align-items: center; gap: 6px; }\n.legend-sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }\n\n/* Project status bars */\n.status-row {\n  display: grid;\n  grid-template-columns: 140px minmax(0, 1fr) 56px;\n  gap: 16px;\n  align-items: center;\n}\n\n/* Across the project */\n.two-col {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);\n  gap: 16px;\n  align-items: stretch;\n  width: 100%;\n}\n.outs-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }\n.female-row {\n  display: grid;\n  grid-template-columns: 170px minmax(0, 1fr) 44px;\n  gap: 12px;\n  align-items: center;\n}\n\n/* Coverage by state */\n.cov-row {\n  display: grid;\n  grid-template-columns: minmax(0, 2.4fr) repeat(4, minmax(0, 1fr));\n  gap: 6px;\n  align-items: stretch;\n}\n.cov-name { display: flex; gap: 8px; align-items: center; padding: 4px 0; min-width: 0; }\n.cov-short { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.cov-state { font-size: 13px; font-weight: 700; color: #6C707A; text-align: center; }\n.cov-cell {\n  border-radius: 5px;\n  font-size: 12px;\n  font-weight: 700;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  min-height: 30px;\n  padding: 2px 4px;\n  line-height: 1.2;\n}\n\n/* Component Cards Grid */\n.cards-grid {\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: 14px;\n  width: 100%;\n  align-items: stretch;\n  box-sizing: border-box;\n}\n.card-inline-details {\n  display: none !important;\n}\n.panel-below-cards {\n  display: flex;\n}\n.activity-card {\n  border: 1px solid #8DB6DC;\n  border-radius: 10px;\n  padding: 18px 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n  background: #FFFFFF;\n  box-sizing: border-box;\n  overflow: visible;\n  word-break: break-word;\n  overflow-wrap: break-word;\n  width: 100%;\n  height: 100%;\n  box-shadow: 0 1px 4px rgba(43, 45, 51, 0.04);\n  transition: border-color 0.2s ease, box-shadow 0.2s ease;\n}\n\n/* Target & Baseline Grid */\n.target-grid {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);\n  gap: 12px;\n  width: 100%;\n  box-sizing: border-box;\n}\n.target-box {\n  border-radius: 8px;\n  padding: 12px 14px;\n  display: flex;\n  flex-direction: column;\n  gap: 4px;\n  box-sizing: border-box;\n}\n.target-box.baseline {\n  background: #F4F3ED;\n  border-left: 3px solid #8A8D93;\n}\n.target-box.endline {\n  background: #1B2A78;\n  border-left: 3px solid #F2E23A;\n}\n.target-label {\n  font-size: 11.5px;\n  letter-spacing: 0.07em;\n  text-transform: uppercase;\n  color: #6C707A;\n  font-weight: 700;\n}\n.target-label.endline-label {\n  color: #8DB6DC;\n}\n.target-content {\n  font-size: 14px;\n  line-height: 1.5;\n  color: #2B2D33;\n  word-break: break-word;\n  overflow-wrap: break-word;\n}\n.target-content.endline-content {\n  color: #FFFFFF;\n}\n\n/* Indicators Table */\n.indicator-table {\n  border: 1px solid rgba(43,45,51,0.14);\n  border-radius: 8px;\n  overflow: hidden;\n  font-size: 14px;\n  line-height: 1.45;\n  width: 100%;\n  background: #FFFFFF;\n  box-sizing: border-box;\n}\n.indicator-row {\n  display: grid;\n  grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);\n  border-bottom: 1px solid rgba(43,45,51,0.10);\n  word-break: break-word;\n  overflow-wrap: break-word;\n  box-sizing: border-box;\n}\n.indicator-row:nth-child(even) {\n  background: #FAFAF7;\n}\n.indicator-row:last-child {\n  border-bottom: none;\n}\n.indicator-key {\n  padding: 10px 12px;\n  color: #555861;\n  font-weight: 600;\n  font-size: 13.5px;\n  word-break: break-word;\n  overflow-wrap: break-word;\n}\n.indicator-val {\n  padding: 10px 12px;\n  font-size: 14px;\n  font-weight: 500;\n  color: #1B2A78;\n  word-break: break-word;\n  overflow-wrap: break-word;\n}\n\n/* Interactive Details Button */\n.btn-details {\n  align-self: flex-start;\n  border-radius: 8px;\n  padding: 8px 16px;\n  min-height: 42px;\n  display: inline-flex;\n  align-items: center;\n  font-size: 14px;\n  font-weight: 600;\n  cursor: pointer;\n  touch-action: manipulation;\n  user-select: none;\n  transition: all 0.15s ease;\n  box-sizing: border-box;\n}\n.btn-details:active {\n  transform: scale(0.98);\n}\n\n/* Tab Bar */\n.tab-bar {\n  display: flex;\n  gap: 20px;\n  border-bottom: 1px solid rgba(43,45,51,0.15);\n  overflow-x: auto;\n  -webkit-overflow-scrolling: touch;\n  white-space: nowrap;\n  padding-bottom: 2px;\n}\n.tab-item {\n  padding: 8px 6px;\n  font-size: 15px;\n  cursor: pointer;\n  touch-action: manipulation;\n}\n\n/* Modal Dialog */\n.modal-overlay {\n  position: fixed;\n  inset: 0;\n  background: rgba(43,45,51,0.55);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 24px;\n  z-index: 1000;\n  backdrop-filter: blur(2px);\n  box-sizing: border-box;\n}\n.modal-box {\n  background: #FFFFFF;\n  border-radius: 12px;\n  width: 100%;\n  max-width: 760px;\n  max-height: 90vh;\n  overflow-y: auto;\n  padding: 28px;\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n  -webkit-overflow-scrolling: touch;\n  box-sizing: border-box;\n}\n\n/* Tablet & Mobile Breakpoints: Full-width cards with in-place full-width accordion */\n@media (max-width: 1024px) {\n  .cards-grid {\n    grid-template-columns: 1fr !important;\n    gap: 16px;\n  }\n  .card-inline-details {\n    display: flex !important;\n    flex-direction: column;\n    gap: 14px;\n    padding-top: 14px;\n    margin-top: 4px;\n    border-top: 1px solid #8DB6DC;\n    width: 100%;\n    box-sizing: border-box;\n    overflow: visible;\n  }\n  .panel-below-cards {\n    display: none !important;\n  }\n  .btn-details {\n    width: 100%;\n    justify-content: center;\n    padding: 10px 16px;\n    font-size: 14px;\n    border-radius: 8px;\n  }\n}\n\n@media (max-width: 960px) {\n  .cards-grid {\n    grid-template-columns: 1fr !important;\n    gap: 16px;\n  }\n  .card-inline-details {\n    display: flex !important;\n  }\n  .panel-below-cards {\n    display: none !important;\n  }\n  .dashboard-viewer {\n    padding: 40px 32px 160px;\n    padding-bottom: max(240px, calc(160px + env(safe-area-inset-bottom, 60px))) !important;\n  }\n  .hero-card {\n    padding: 28px 24px 24px;\n    gap: 20px;\n  }\n  .about-grid {\n    grid-template-columns: 1fr;\n    gap: 24px;\n  }\n}\n\n/* Tablet Portrait & Mobile */\n@media (max-width: 768px) {\n  .target-grid {\n    grid-template-columns: 1fr;\n    gap: 10px;\n  }\n  .indicator-row {\n    display: flex;\n    flex-direction: column;\n    padding: 10px 12px;\n    gap: 4px;\n  }\n  .indicator-row:nth-child(even) {\n    background: #F8F8F5;\n  }\n  .indicator-key {\n    padding: 0;\n    color: #656872;\n    font-size: 11.5px;\n    font-weight: 700;\n    text-transform: uppercase;\n    letter-spacing: 0.05em;\n  }\n  .indicator-val {\n    padding: 0;\n    font-size: 14.5px;\n    font-weight: 600;\n    color: #1B2A78;\n    line-height: 1.45;\n  }\n}\n\n/* Enhanced Viewport Edge Padding & Mobile Touch Ergonomics */\n@media (max-width: 680px) {\n  .dashboard-viewer {\n    padding: 32px 24px 140px;\n    padding-bottom: max(200px, calc(140px + env(safe-area-inset-bottom, 60px))) !important;\n  }\n  .hero-card {\n    padding: 24px 20px 22px;\n    border-radius: 12px;\n    gap: 18px;\n  }\n  .kpi-grid {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n    gap: 12px;\n  }\n  .kpi-card {\n    padding: 14px 12px;\n  }\n  .component-header {\n    padding: 18px 20px;\n  }\n  .component-meta {\n    white-space: normal;\n  }\n  .modal-overlay {\n    padding: 16px;\n    align-items: flex-end;\n  }\n  .modal-box {\n    max-height: 85vh;\n    padding: 22px 18px;\n    border-bottom-left-radius: 0;\n    border-bottom-right-radius: 0;\n  }\n}\n\n@media (max-width: 420px) {\n  .dashboard-viewer {\n    padding: 26px 20px 120px;\n    padding-bottom: max(180px, calc(120px + env(safe-area-inset-bottom, 60px))) !important;\n  }\n  .hero-card {\n    padding: 20px 16px 18px;\n  }\n  .kpi-grid {\n    grid-template-columns: 1fr;\n    gap: 10px;\n  }\n  .modal-box {\n    padding: 18px 14px;\n  }\n}\n\n/* Output photos (shown only inside open details; thumbnails are lazy-loaded) */\n.photo-block { display: flex; flex-direction: column; gap: 8px; }\n.photo-label { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #6C707A; font-weight: 700; }\n.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }\n.photo { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }\n.photo a { display: block; border-radius: 6px; overflow: hidden; background: #EEF3F8; }\n.photo img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; }\n.photo a:focus-visible { outline: 2px solid #1B2A78; outline-offset: 2px; }\n.photo figcaption { font-size: 13px; line-height: 1.4; color: #555861; }\n@media (max-width: 420px) {\n  .photo-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }\n  .photo figcaption { font-size: 12.5px; }\n}\n\n/* New sections (map, status, coverage): responsive rules */\n@media (max-width: 960px) {\n  .two-col { grid-template-columns: 1fr; }\n}\n/* map component's own 860px rule targets bare .main and loses to \"beneficiary-map .main\" */\n@media (max-width: 860px) {\n  beneficiary-map .main { grid-template-columns: 1fr !important; }\n}\n@media (max-width: 680px) {\n  .panel-card { padding: 18px 16px; gap: 14px; }\n  .status-row { grid-template-columns: 104px minmax(0, 1fr) 44px; gap: 10px; }\n  .status-name { font-size: 14px !important; white-space: nowrap; }\n  .female-row { grid-template-columns: 112px minmax(0, 1fr) 40px; gap: 10px; }\n  .outs-grid { gap: 8px; }\n  /* Coverage: output name on its own line, four state cells below */\n  .cov-row { grid-template-columns: repeat(4, minmax(0, 1fr)); }\n  .cov-row > .cov-name { grid-column: 1 / -1; padding: 8px 0 0; }\n  .cov-row > .cov-spacer { display: none; }\n  .cov-short { white-space: normal; }\n  .cov-cell { font-size: 11px; min-height: 32px; }\n  .component-header { padding: 16px 18px; }\n  .component-counts { gap: 20px; }\n  /* Beneficiary map component */\n  beneficiary-map .bm-map { height: 380px !important; }\n  beneficiary-map .seg { display: flex !important; width: 100%; }\n  beneficiary-map .seg button { flex: 1; padding: 10px 8px !important; font-size: 13px !important; }\n  beneficiary-map .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 8px !important; }\n  beneficiary-map .metric { paddi qc+zFYYwGSullXHNpX2fn6H3yZhRcpEol+eWd//2NXjapOxEfEc7SJwuiNtBA8VrYt7NgZ3/GimjWnsHYI+VrCTy0XRGSLPQLd1HC9Dx1xIWPHJrT1f2R1ro9SjsQrUR3mgSW4TuObGdXIDcX9ZGXpP/Q737f4bj0KqjeCcqFTKGeDl0FbduphtQAvON+nf5tupH51GaCoKccU33QZAbTqVFWn1driY8AAAAAAATvjYYIxvIwJquIAAAAAAAAAAA=\" alt=\"Adaptation Fund\" width=\"227\" height=\"54\">\n    <\u002Fdiv>\n    <div class=\"hero-card\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <div class=\"hero-subtitle\">An Adaptation Fund project<\u002Fdiv>\n      <h1 class=\"hero-title\" style=\"margin:0\">Enhancing the Climate Resilience of Vulnerable Island Communities in Federated States of Micronesia<\u002Fh1>\n    <\u002Fdiv>\n    <div class=\"kpi-grid\">\n      <div class=\"kpi-card\"><div class=\"kpi-label\">Adaptation Fund grant<\u002Fdiv><div class=\"kpi-val\">USD 9m<\u002Fdiv><\u002Fdiv><div class=\"kpi-card\"><div class=\"kpi-label\">Project period<\u002Fdiv><div class=\"kpi-val\">2018–2027<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi-card\"><div class=\"kpi-label\">Water units repaired or installed<\u002Fdiv><div class=\"kpi-val\">281<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi-card\"><div class=\"kpi-label\">People impacted<\u002Fdiv><div class=\"kpi-val\">3,253<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"section-title\">About the project<\u002Fdiv>\n    <div class=\"about-grid\">\n      <div class=\"about-text\">\n        <p style=\"margin:0\">The project helps vulnerable island communities in the Federated States of Micronesia adapt to climate change, particularly drought, sea level rise and coastal erosion. It is funded by the Adaptation Fund, implemented by the Secretariat of the Pacific Regional Environment Programme (SPREP) and managed in-country by FSM's Department of Environment, Climate Change and Emergency Management.<\u002Fp>\n        <p style=\"margin:0\">Since work began in 2018, 281 water infrastructure units have been repaired or installed and 500 community members have taken part in climate and WASH activities. Nukuoro and Kapingamarangi have not needed to declare a drought emergency since their tanks were installed. Final activities, including coastal protection works in Kosrae, are under way ahead of closure in 2027.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"work-areas\">\n        <div style=\"font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #6C707A; font-weight: 700; text-align: left\">Four areas of work<\u002Fdiv>\n        <div class=\"work-area-item\"><span class=\"work-area-num\">1<\u002Fspan><span class=\"work-area-text\">Reviewing national and state laws so climate risks are built into planning and development<\u002Fspan><\u002Fdiv>\n        <div class=\"work-area-item\"><span class=\"work-area-num\">2<\u002Fspan><span class=\"work-area-text\">Improving water security on six outer atolls in Yap, Chuuk and Pohnpei through rainwater tanks and wells<\u002Fspan><\u002Fdiv>\n        <div class=\"work-area-item\"><span class=\"work-area-num\">3<\u002Fspan><span class=\"work-area-text\">Protecting coastal communities in Kosrae, where homes and roads sit on a narrow strip exposed to waves<\u002Fspan><\u002Fdiv>\n        <div class=\"work-area-item\"><span class=\"work-area-num\">4<\u002Fspan><span class=\"work-area-text\">Building local knowledge through training and awareness materials<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"section-title\">Who the project reaches<\u002Fdiv>\n    <x-import component-from-global-scope=\"beneficiary-map\" from=\"461662f8-b7f4-4861-9817-85d2b7f316a9#/beneficiary-map.js\" hint-size=\"100%,720px\" style=\"width: 100%\"><\u002Fx-import>\n\n    <div class=\"section-title\">Project status<\u002Fdiv>\n    <div class=\"panel-card\" style=\"gap:16px\">\n      <sc-for list=\"{{ tiles }}\" as=\"c\" hint-placeholder-count=\"4\">\n        <div class=\"status-row\">\n          <div class=\"status-name\" style=\"font-size:15px;font-weight:7 () {\n    const data = window.VIEWER_DATA || [];\n    const layout = this.props.layout ?? 'Output cards';\n    const panel = (this.props.details ?? 'Panel below cards') === 'Panel below cards';\n    const all = [];\n    const tiles = data.map((c, ci) => {\n      const done = c.acts.filter(a => a.status === 'Completed').length;\n      const acts = c.acts.map(a => {\n        const open = !!this.state.open[a.code], comp = a.status === 'Completed';\n        const isSel = panel && this.state.dlg === a.code;\n        const o = { code: a.code, title: a.title, status: a.status, ongoing: !comp, open, chev: open ? '▾' : '▸',\n          isSel, notSel: !isSel, baseline: a.baseline, target: a.target,\n          photos: ((window.VIEWER_PHOTOS || {})[a.code] || []).map(([thumb, full, cap]) => ({ thumb, full, cap })),\n          hasPhotos: !!(window.VIEWER_PHOTOS || {})[a.code],\n          inds: [...a.ind.map(([k, v]) => ({ k, v })), ...(a.note ? [{ k: 'Note', v: a.note }] : [])],\n          toggle: () => this.setState(s => ({ open: { ...s.open, [a.code]: !s.open[a.code] } })),\n          openDlg: () => this.setState(s => ({ dlg: s.dlg === a.code ? null : a.code })) };\n        all.push(o); return o;\n      });\n      const ti = this.state.tab[ci] ?? 0;\n      return { name: c.name, pctLabel: Math.round(c.pct * 100) + '%', pctWidth: (c.pct * 100) + '%',\n        done, ongoing: c.acts.length - done, acts, cur: acts[ti],\n        hasSel: acts.some(a => a.isSel), sel: acts.find(a => a.isSel) || {},\n        tabs: acts.map((a, i) => ({ label: a.code, active: i === ti, inactive: i !== ti, onClick: () => this.setState(s => ({ tab: { ...s.tab, [ci]: i } })) })) };\n    });\n    const dlg = all.find(a => a.code === this.state.dlg);\n    const allOuts = all.map(a => ({ code: a.code, bg: a.ongoing ? '#F2E23A' : '#1B2A78', fg: a.ongoing ? '#2B2D33' : '#FFFFFF' }));\n    const female = [['1.1', 'National', 40], ['1.1', 'State', 30], ['1.1', 'Overall', 34], ['2.1', 'Satawan / Lekinioch', 37], ['2.1', 'Nukuoro / Kapinga.', 39]]\n      .map(([out, label, v]) => ({ out, label, v: v + '%', w: v + '%' }));\n    const C = { D: ['#1B2A78', '#FFFFFF', '#1B2A78', 'Completed'], O: ['#F2E23A', '#2B2D33', '#F2E23A', 'Ongoing'], N: ['#FFFFFF', '#1B2A78', '#8DB6DC', 'Not started'], '-': ['#F7F5EF', '#8A8D93', '#F7F5EF', ''] };\n    const cov = { '1.1': 'DDDD', '1.2': 'DDDO', '1.3': 'NDNN', '2.1': 'OOO-', '2.2': 'OOO-', '2.3': 'OOO-', '3.1': '---D', '3.2': '---O', '4.1': '-OO-' };\n    const matrix = data.flatMap(c => c.acts).map(a => ({ code: a.code, short: a.short,\n      cells: (cov[a.code] || '----').split('').map(k => { const [bg, fg, bd, label] = C[k]; return { bg, fg, bd, label }; }) }));\n    return { tiles, allOuts, female, matrix, totalAll: all.length, doneAll: all.filter(a => !a.ongoing).length, isCards: layout === 'Output cards', isExpanders: layout === 'Expanders', isTabs: layout === 'Output tabs',\n      hasDlg: layout === 'Output cards' && !panel && !!dlg, dlg: dlg || {}, closeDlg: () => this.setState({ dlg: null }), stop: e => e.stopPropagation() };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
